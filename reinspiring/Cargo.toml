[package]
name = "reinspiring"
version = "0.1.1"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "ReinspiRING: coefficient-domain compilation of InspiRING.Pack (eprint 2026/1934, Algorithm 2)"
readme = "README.md"
repository = "https://github.com/valargroup/ipir-sp"
keywords = ["fhe", "lattice", "rlwe", "lwe", "pir"]
categories = ["cryptography"]

[dependencies]
memmap2 = "0.9"
bytemuck = "1"
inspiring = { path = "../inspiring", version = "=0.1.0-rc.2" }
spiral-rs = { workspace = true }
thiserror = "1.0"
rayon = "1"
rand_chacha = "0.3.1"
sha2 = "0.10"
zeroize = "1.8.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand_chacha = "0.3.1"
serde_json = "1.0"

[[bench]]
name = "pack"
harness = false

[[bench]]
name = "paper_q254"
harness = false
