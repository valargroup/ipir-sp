[package]
name = "ipir-native-client"
version = "0.1.0-rc.1"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Native PIR profiles, public material, query generation and response decoding"
repository = "https://github.com/valargroup/ipir-sp"
readme = "README.md"

[dependencies]
reinspiring = { path = "../reinspiring", version = "=0.1.3-rc.1" }
rand = { version = "0.9", default-features = false, features = ["os_rng"] }
rand_chacha = "0.3.1"
sha2 = "0.10"
