[package]
name = "ipir-sp"
version = "0.1.0-rc.2"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
description = "IPIR-SP glue crate using InspiRING.Pack as the ring-packing primitive."
repository = "https://github.com/valargroup/ipir-sp"

[dependencies]
inspiring = { path = "../inspiring", version = "=0.1.0-rc.1" }
reinspiring = { path = "../reinspiring", version = "0.1.0" }
simplepir-kernel = { path = "../simplepir-kernel", version = "=0.1.0-rc.1" }
spiral-rs = { workspace = true }
# Operating-system entropy for client seeds only. Public CRS expansion goes
# through `sampling`, so the wire format does not depend on this version.
rand = { version = "0.9", default-features = false, features = ["os_rng"] }
rand_chacha = "0.3.1"
log = "0.4.20"
env_logger = "0.11.1"
clap = { version = "4.5.0", features = ["derive"] }
fastrand = "2.0.0"
rayon = "1"
serde = { version = "1.0.160", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10.6"
sha2 = "0.10"
actix-cors = { version = "=0.7.0", optional = true }
actix-web = { version = "=4.11.0", optional = true }
reqwest = { version = "0.12", features = ["blocking"], optional = true }

[features]
default = []
cuda = ["simplepir-kernel/cuda"]
experimental-key-reuse = []
experimental-params = []
native-reinspiring = []
http_server = ["dep:actix-cors", "dep:actix-web"]
http_client = ["dep:reqwest"]

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }

[[bench]]
name = "end_to_end"
harness = false
required-features = ["experimental-params"]

[[bench]]
name = "pack_backends_d2048"
harness = false

[[bench]]
name = "client_decode"
harness = false

[[example]]
name = "key_reuse_bench"
required-features = ["experimental-key-reuse", "experimental-params"]

[[example]]
name = "native_e2e"
required-features = ["native-reinspiring"]
