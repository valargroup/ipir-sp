name: Development tooling

on:
  pull_request:
    paths:
      - "scripts/dev.py"
      - "scripts/test_dev.py"
      - ".github/workflows/dev-tooling.yml"
      - "reinspiring/tools/security/**"
      - "reinspiring/src/native_gaussian_cdf.txt"
      - "bench-results/**"
  push:
    paths:
      - "scripts/dev.py"
      - "scripts/test_dev.py"
      - ".github/workflows/dev-tooling.yml"
      - "reinspiring/tools/security/**"
      - "reinspiring/src/native_gaussian_cdf.txt"
      - "bench-results/**"

jobs:
  leases:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s scripts -p 'test_dev.py' -v

  certifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s reinspiring/tools/security -v
