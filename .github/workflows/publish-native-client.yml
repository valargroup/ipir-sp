name: Publish native client

on:
  pull_request:
    paths:
      - ".github/workflows/publish-native-client.yml"
      - "ipir-native-client/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:
    inputs:
      mode:
        description: Verify the package, or publish the first native-client release
        type: choice
        required: true
        default: verify
        options: [verify, publish]

permissions: {}

concurrency:
  group: publish-native-client
  cancel-in-progress: false

jobs:
  verify:
    name: Verify native client package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check release identity
        run: |
          python3 - <<'PYCODE'
          import pathlib, tomllib
          package = tomllib.loads(pathlib.Path("ipir-native-client/Cargo.toml").read_text())["package"]
          assert package["name"] == "ipir-native-client"
          assert package["version"] == "0.1.0-rc.1"
          PYCODE
      - name: Select the repository toolchain
        run: rustup show
      - name: Test the client and its dependency boundary
        run: cargo test --locked -p ipir-native-client
      - name: Verify the package against registry dependencies
        run: cargo publish --dry-run --locked -p ipir-native-client

  publish:
    name: Publish native client
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' && github.repository == 'valargroup/ipir-sp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select the repository toolchain
        run: rustup show
      - name: Publish the verified first release
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::Set the crates-io environment's CARGO_REGISTRY_TOKEN from Infisical before publishing."
            exit 1
          fi
          cargo publish --locked -p ipir-native-client
      - name: Confirm the version on crates.io
        run: |
          python3 - <<'PYCODE'
          import json, time, urllib.error, urllib.request
          url = "https://crates.io/api/v1/crates/ipir-native-client/0.1.0-rc.1"
          for attempt in range(24):
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "valargroup-ipir-release"})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      version = json.load(response)["version"]
                  assert version["num"] == "0.1.0-rc.1" and not version["yanked"]
                  print("Confirmed ipir-native-client 0.1.0-rc.1 on crates.io")
                  break
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  if attempt == 23:
                      raise
                  time.sleep(5)
          PYCODE
